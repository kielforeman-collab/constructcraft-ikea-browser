name: Release Plugin

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Package plugin archive
        run: |
          mkdir -p dist
          tag="${GITHUB_REF_NAME}"
          zip_name="ikea_browser-${tag}.zip"
          zip -r "dist/${zip_name}" plugin.toml main.lua README.md locales/
          (cd dist && sha256sum "${zip_name}" > SHA256SUMS.txt)
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" dist/* \
            --title "IKEA Browser $tag" \
            --notes "IKEA Browser plugin (Plugin API 3) for ConstructCraft, backed by the Hugging Face \`T-K-233/ikea-furniture\` dataset (36,447 verified Draco-compressed GLB models).

          ### Installation
          1. Download \`ikea_browser-${tag}.zip\` below.
          2. In ConstructCraft (build with Plugin API 3), open **Manage → Plugins** and install the archive (or unzip into your plugins folder).
          3. Enable **Allow it to access the network** for IKEA Browser in **Manage → Plugins**.
          4. Open the **Component Library** and switch to the **IKEA** tab."
